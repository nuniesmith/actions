# Provision from the canonical scripts repo; credentials stay on the server.
name: 🖥️ Server Setup

on:
    workflow_dispatch:
        inputs:
            tailscale_ip:
                description: "Tailscale IPv4 address of the server"
                required: true
                type: string
            ssh_user:
                description: "Existing SSH user with sudo access"
                required: true
                type: string
                default: "jordan"
            ssh_password:
                description: "Legacy SSH/sudo password input; prefer SERVER_SETUP_SSH_PASSWORD secret"
                required: false
                type: string
            ssh_port:
                description: "Existing SSH port"
                required: false
                type: string
                default: "22"
            repo_url:
                description: "Optional repository to clone (private repos need server-side Git access)"
                required: false
                type: string
            repo_branch:
                description: "Repository branch"
                required: false
                type: string
                default: "main"
            server_name:
                description: "Server/project name (letters, digits, dots, underscores, hyphens)"
                required: false
                type: string
                default: "production"
            scripts_ref:
                description: "nuniesmith/scripts branch, tag, or commit"
                required: false
                type: string
                default: "main"

permissions:
    contents: read

concurrency:
    group: server-setup-${{ inputs.tailscale_ip }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    setup-server:
        name: Provision server and generate credentials
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout canonical setup scripts
              uses: actions/checkout@v4
              with:
                  repository: nuniesmith/scripts
                  ref: ${{ inputs.scripts_ref }}
                  path: canonical-scripts
                  sparse-checkout: scripts/setup
                  persist-credentials: false

            - name: Connect to Tailscale
              uses: tailscale/github-action@v4
              with:
                  oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
                  tags: tag:ci

            - name: Install SSH client
              run: |
                  sudo apt-get update
                  sudo apt-get install -y sshpass openssh-client

            - name: Provision and generate credentials on the server
              env:
                  SSHPASS: ${{ secrets.SERVER_SETUP_SSH_PASSWORD || inputs.ssh_password }}
                  TARGET_IP: ${{ inputs.tailscale_ip }}
                  INITIAL_USER: ${{ inputs.ssh_user }}
                  SSH_PORT: ${{ inputs.ssh_port }}
                  SERVER_NAME: ${{ inputs.server_name }}
                  REPO_URL: ${{ inputs.repo_url }}
                  REPO_BRANCH: ${{ inputs.repo_branch }}
              run: |
                  set -euo pipefail
                  umask 077
                  # Legacy dispatch inputs are not automatically masked as secrets.
                  masked_password=${SSHPASS//'%'/'%25'}
                  masked_password=${masked_password//$'\r'/'%0D'}
                  masked_password=${masked_password//$'\n'/'%0A'}
                  printf '::add-mask::%s\n' "$masked_password"
                  [[ -n "$SSHPASS" ]] || { echo "::error::Set SERVER_SETUP_SSH_PASSWORD."; exit 1; }
                  [[ "$SSHPASS" != *$'\n'* && "$SSHPASS" != *$'\r'* ]] || {
                    echo "::error::The SSH/sudo password must be a single line."; exit 1;
                  }
                  [[ "$TARGET_IP" =~ ^100\.([0-9]{1,3}\.){2}[0-9]{1,3}$ ]] || {
                    echo "::error::Expected a Tailscale IPv4 address."; exit 1;
                  }
                  [[ "$INITIAL_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || { echo "::error::Invalid SSH user."; exit 1; }
                  [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 )) || {
                    echo "::error::Invalid SSH port."; exit 1;
                  }
                  [[ "$SERVER_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || {
                    echo "::error::Invalid server/project name."; exit 1;
                  }
                  if [[ -n "$REPO_URL" ]]; then
                    [[ "$REPO_URL" =~ ^(https://|ssh://|git@) && "$REPO_URL" != *$'\n'* ]] || {
                      echo "::error::Use an HTTPS or SSH repository URL."; exit 1;
                    }
                    git check-ref-format --branch "$REPO_BRANCH" >/dev/null
                    repo_name=$(basename "$REPO_URL" .git)
                    [[ "$repo_name" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]] || {
                      echo "::error::Invalid repository name."; exit 1;
                    }
                  fi

                  bundle_dir=$(mktemp -d "$RUNNER_TEMP/server-setup.XXXXXXXX")
                  remote_dir=""
                  target="$INITIAL_USER@$TARGET_IP"
                  ssh_options=(-o StrictHostKeyChecking=accept-new
                    -o UserKnownHostsFile="$bundle_dir/known_hosts" -o ConnectTimeout=30
                    -o ServerAliveInterval=30 -o ServerAliveCountMax=10)
                  cleanup() {
                    if [[ -n "$remote_dir" ]]; then
                      sshpass -e ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" \
                        "rm -rf -- '$remote_dir'" >/dev/null 2>&1 || true
                    fi
                    rm -rf -- "$bundle_dir"
                  }
                  trap cleanup EXIT
                  for setup_file in setup-prod-server.sh setup-ubuntu.sh generate-secrets.sh; do
                    cp "canonical-scripts/scripts/setup/$setup_file" "$bundle_dir/$setup_file"
                    bash -n "$bundle_dir/$setup_file"
                  done

                  # Run all privileged steps in one SSH session. No generated key
                  # or credential file is transferred back to the runner.
                  cat > "$bundle_dir/provision.sh" <<'REMOTE'
                  #!/usr/bin/env bash
                  set -euo pipefail
                  umask 077
                  script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)
                  trap 'rm -rf -- "$script_dir"' EXIT
                  ssh_port=$1
                  initial_user=$2
                  server_name=$3
                  repo_url=$4
                  repo_branch=$5

                  setup_log=$(mktemp /root/server-setup.XXXXXXXX.log)
                  if ! bash "$script_dir/setup-prod-server.sh" \
                    --project "$server_name" --user "$initial_user" --ssh-port "$ssh_port" \
                    --actions-user actions --skip-secrets --skip-tailscale-serve --no-confirm \
                    </dev/null >"$setup_log" 2>&1; then
                    printf 'Server setup failed. Inspect locally with: sudo cat %s\n' "$setup_log" >&2
                    exit 1
                  fi

                  credentials_log=$(mktemp /root/github-secrets.XXXXXXXX.txt)
                  if ! bash "$script_dir/generate-secrets.sh" --no-confirm --env prod \
                    </dev/null >"$credentials_log" 2>&1; then
                    printf 'Secret generation failed. Inspect locally with: sudo cat %s\n' "$credentials_log" >&2
                    exit 1
                  fi
                  printf 'Setup log: %s\n' "$setup_log"
                  printf 'Credential file location and copy instructions: sudo cat %s\n' "$credentials_log"

                  if [[ -n "$repo_url" ]]; then
                    repo_name=$(basename "$repo_url" .git)
                    sudo -H -u actions env GIT_TERMINAL_PROMPT=0 bash -s -- \
                      "$repo_url" "$repo_branch" "$repo_name" <<'CLONE'
                  set -euo pipefail
                  repo_url=$1
                  repo_branch=$2
                  repo_path="/home/actions/$3"
                  if [[ -e "$repo_path/.git" ]]; then
                    [[ "$(git -C "$repo_path" remote get-url origin)" == "$repo_url" ]] || {
                      echo "Existing checkout has a different origin; leaving it unchanged." >&2
                      exit 1
                    }
                    [[ -z "$(git -C "$repo_path" status --porcelain)" ]] || {
                      echo "Existing checkout has local changes; leaving it unchanged." >&2
                      exit 1
                    }
                    git -C "$repo_path" fetch origin "$repo_branch"
                    git -C "$repo_path" checkout "$repo_branch"
                    git -C "$repo_path" merge --ff-only FETCH_HEAD
                  else
                    git clone --branch "$repo_branch" -- "$repo_url" "$repo_path"
                  fi
                  printf 'Repository ready at %s. Deploy using the application workflow.\n' "$repo_path"
                  CLONE
                  fi
                  REMOTE
                  bash -n "$bundle_dir/provision.sh"

                  remote_dir=$(sshpass -e ssh "${ssh_options[@]}" -p "$SSH_PORT" "$target" \
                    'umask 077; mktemp -d /tmp/actions-server-setup.XXXXXXXX')
                  [[ "$remote_dir" =~ ^/tmp/actions-server-setup\.[a-zA-Z0-9]{8}$ ]] || {
                    remote_dir=""
                    echo "::error::Unexpected remote temporary directory."
                    exit 1
                  }
                  sshpass -e scp "${ssh_options[@]}" -P "$SSH_PORT" \
                    "$bundle_dir/"*.sh "$target:$remote_dir/"

                  # Quote every argument independently; send the sudo password only
                  # through stdin, so apostrophes and shell metacharacters are safe.
                  printf -v remote_command '%q ' sudo -S -p '' -- env DEBIAN_FRONTEND=noninteractive \
                    bash "$remote_dir/provision.sh" "$SSH_PORT" "$INITIAL_USER" \
                    "$SERVER_NAME" "$REPO_URL" "$REPO_BRANCH"
                  printf '%s\n' "$SSHPASS" | sshpass -e ssh "${ssh_options[@]}" \
                    -p "$SSH_PORT" "$target" "$remote_command"

            - name: Explain how to retrieve credentials
              run: |
                  cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
                  ## Server setup complete

                  Setup used `nuniesmith/scripts/scripts/setup`. Generated secrets
                  remain on the server. The provisioning step prints the exact path
                  to a root-owned report containing the credentials file location.

                  On the server, read that report with `sudo cat /root/github-secrets.<id>.txt`,
                  then read the credentials file it identifies. Add these repository
                  secrets in the application repository (for example, `nuniesmith/lifeos`):

                  | Secret | Value |
                  |---|---|
                  | `PROD_TAILSCALE_IP` | Server's `tailscale ip -4` |
                  | `PROD_SSH_USER` | `actions` |
                  | `PROD_SSH_PORT` | The server's SSH port |
                  | `PROD_SSH_KEY` | Entire private key from `sudo cat /home/actions/.ssh/id_ed25519` |

                  Tailscale's `TAILSCALE_OAUTH_CLIENT_ID` and `TAILSCALE_OAUTH_SECRET`
                  come from your Tailscale account. Optional repository cloning
                  prepares the checkout; use your application deployment workflow
                  to start production services. Configure Tailscale HTTPS separately.
                  SUMMARY
